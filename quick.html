<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPark - Smart Parking</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /*--------------------------------------------------
        [1. ROOT VARIABLES & RESET]
        --------------------------------------------------*/
        :root {
            --primary-color: #00f2ff;
            --secondary-color: #d000ff;
            --bg-color: #0c0a18;
            --text-color: #f0f0f0;
            --text-muted: #aaa;
            --success-color: #00ff7f;
            --error-color: #ff4d4d;

            /* Glassmorphism Variables */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: rgba(0, 0, 0, 0.2);
            --glass-blur: 10px;
            --neon-glow: 0 0 15px var(--primary-color), 0 0 5px var(--primary-color);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            background-image: linear-gradient(135deg, var(--bg-color) 0%, #1a1a2e 100%);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /*--------------------------------------------------
        [2. CORE LAYOUT & VIEW SWITCHING]
        --------------------------------------------------*/
        /* Hide all views by default */
        #auth-view,
        #app-view {
            display: none;
            min-height: 100vh;
        }

        /* Show the active view */
        body[data-view="auth"] #auth-view {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        body[data-view="app"] #app-view {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Dashboard View Switching */
        .dashboard-view {
            display: none;
        }

        body[data-role="user"] #user-dashboard-view {
            display: block;
        }

        body[data-role="owner"] #owner-dashboard-view {
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 0;
        }

        h1, h2, h3 {
            font-weight: 600;
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.5);
        }

        /*--------------------------------------------------
        [3. GLASSMORPHISM COMPONENT]
        --------------------------------------------------*/
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px var(--glass-shadow);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 40px var(--glass-shadow), 0 0 20px rgba(0, 242, 255, 0.3);
            border-color: var(--primary-color);
        }

        /*--------------------------------------------------
        [4. AUTHENTICATION VIEW]
        --------------------------------------------------*/
        #auth-container {
            width: 90%;
            max-width: 420px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Neon border effect */
        #auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            z-index: -1;
            opacity: 0.7;
        }

        #auth-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: var(--primary-color);
        }

        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
            animation: slideUp 0.4s ease-out;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            opacity: 0.7;
        }

        .form-input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: var(--neon-glow);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* Role Selector */
        .role-selector {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1.5rem;
        }
        .role-selector label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .role-selector input {
            display: none;
        }
        .role-selector input:checked + span {
            color: var(--primary-color);
        }
        .role-selector label:hover {
            background: var(--glass-bg);
            border-color: var(--primary-color);
        }
        .role-selector i {
            margin-right: 8px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 8px;
            color: var(--bg-color);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1.5rem;
        }
        .toggle-auth .toggle-link {
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
        }
        .toggle-auth .toggle-link:hover {
            text-decoration: underline;
        }

        /*--------------------------------------------------
        [5. APP VIEW (MAIN APP)]
        --------------------------------------------------*/
        
        /* App Navbar */
        .app-navbar {
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
            text-shadow: var(--neon-glow);
        }

        .user-menu {
            position: relative;
        }
        .user-avatar {
            display: flex;
            align-items: center;
            cursor: pointer;
            background: var(--glass-bg);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        .user-avatar i {
            font-size: 1.2rem;
            margin-right: 8px;
            color: var(--primary-color);
        }
        #nav-username {
            font-weight: 500;
        }
        
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 120%;
            min-width: 200px;
            z-index: 1001;
        }
        .dropdown-menu.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }
        .dropdown-menu ul {
            list-style: none;
        }
        .dropdown-menu li a {
            display: block;
            padding: 12px 20px;
            color: var(--text-color);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .dropdown-menu li a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
        }
        .dropdown-menu li a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        #nav-owner-link {
            display: none; /* Shown by JS for owners */
        }
        body[data-role="owner"] #nav-owner-link {
            display: block;
        }

        /*--------------------------------------------------
        [6. USER DASHBOARD]
        --------------------------------------------------*/
        
        /* Hero Section */
        .hero-section {
            padding: 4rem 0;
            text-align: center;
        }
        .hero-section h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-section p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 5px;
            background: var(--glass-bg);
        }
        #search-input {
            flex-grow: 1;
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 1rem;
        }
        #search-input:focus {
            outline: none;
        }
        .search-btn {
            padding: 10px 25px;
            margin-left: 5px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
        }
        #location-btn {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        #location-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: var(--neon-glow);
        }
        #search-btn-main {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: var(--bg-color);
        }
        #search-btn-main:hover {
            transform: scale(1.05);
        }

        /* Results Section */
        .results-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 3rem;
        }
        
        .map-container {
            position: sticky;
            top: 100px; /* Below navbar */
            height: 500px;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }
        
        #slot-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .slot-card {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            cursor: pointer;
        }
        .slot-card-image {
            width: 150px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }
        .slot-card-details {
            flex-grow: 1;
        }
        .slot-card-details h3 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .slot-card-details p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .slot-card-price {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--success-color);
        }
        .slot-card-price span {
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--text-muted);
        }

        /*--------------------------------------------------
        [7. OWNER DASHBOARD]
        --------------------------------------------------*/
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .btn-secondary {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: var(--neon-glow);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            padding: 1.5rem;
        }
        .stat-card i {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .stat-card h3 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .stat-card p {
            font-size: 2.2rem;
            font-weight: 600;
        }
        
        #owner-spaces-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .owner-space-card {
            padding: 1.5rem;
        }
        .owner-space-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .owner-space-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .space-actions {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-edit {
            background: #2a9d8f;
            color: white;
        }
        .btn-delete {
            background: #e76f51;
            color: white;
        }

        /*--------------------------------------------------
        [8. MODALS]
        --------------------------------------------------*/
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            padding: 2.5rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s ease-out;
        }
        .modal-content.modal-lg {
            max-width: 900px;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-muted);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .modal-close:hover {
            color: var(--primary-color);
            transform: rotate(90deg);
        }

        .modal-header h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        /* Slot Detail Modal */
        #slot-detail-modal .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        /* Carousel */
        .carousel {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        .carousel-images {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-images img {
            width: 100%;
            flex-shrink: 0;
            object-fit: cover;
            height: 250px;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--primary-color);
            padding: 5px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .carousel-btn.prev { left: 10px; }
        .carousel-btn.next { right: 10px; }

        .slot-info h3 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }
        .slot-info .price {
            font-size: 2rem;
            font-weight: 700;
            color: var(--success-color);
            margin: 10px 0;
        }
        .slot-info .price span {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 300;
        }
        .slot-info p {
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .btn-3d {
            width: 100%;
            margin-bottom: 1rem;
        }

        /* Booking Form */
        .booking-form .input-group {
            margin-bottom: 1rem;
        }
        .booking-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .booking-form .form-input {
            padding-left: 15px;
        }

        /* 3D Preview Modal */
        #3d-preview-modal .modal-content {
            padding: 1rem;
        }
        #3d-iframe {
            width: 100%;
            height: 70vh;
            border: none;
            border-radius: 12px;
        }

        /* Add Space Modal */
        #add-space-modal form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .input-group.full-width {
            grid-column: 1 / -1;
        }

        /* Booking History Modal */
        #booking-history-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 60vh;
            overflow-y: auto;
        }
        .booking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }
        .booking-item-details h4 {
            color: var(--primary-color);
        }
        .booking-item-details p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .booking-item-status {
            font-weight: 600;
        }
        .booking-item-status.completed {
            color: var(--success-color);
        }
        .booking-item-status.pending {
            color: #ffc107;
        }

        /*--------------------------------------------------
        [9. UTILITY CLASSES]
        --------------------------------------------------*/
        
        /* Global Loader */
        #loader {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 10, 24, 0.8);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }
        #loader.active {
            display: flex;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--glass-border);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 15px 25px;
            border-radius: 8px;
            color: var(--bg-color);
            font-weight: 600;
            animation: slideInRight 0.3s ease-out;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            background: var(--success-color);
        }
        .toast.error {
            background: var(--error-color);
        }
        .toast.hide {
            animation: slideOutRight 0.3s ease-in forwards;
        }

        /* Skeleton Loaders */
        .skeleton {
            background: linear-gradient(90deg, var(--glass-bg) 25%, rgba(255, 255, 255, 0.1) 50%, var(--glass-bg) 75%);
            background-size: 200% 100%;
            animation: pulse 1.5s infinite;
            border-radius: 8px;
        }
        .skeleton-text {
            height: 1rem;
            margin-bottom: 0.5rem;
        }
        .skeleton-img {
            height: 100px;
            width: 150px;
        }
        .skeleton-card {
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }
        .skeleton-card-details {
            flex: 1;
        }

        /*--------------------------------------------------
        [10. ANIMATIONS]
        --------------------------------------------------*/
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /*--------------------------------------------------
        [11. RESPONSIVENESS]
        --------------------------------------------------*/
        @media (max-width: 900px) {
            .results-section {
                grid-template-columns: 1fr;
            }
            .map-container {
                position: relative;
                top: 0;
                height: 300px;
            }
        }

        @media (max-width: 768px) {
            #slot-detail-modal .modal-body {
                grid-template-columns: 1fr;
            }
            #add-space-modal form {
                grid-template-columns: 1fr;
            }
            .input-group.full-width {
                grid-column: 1; /* Reset for single column */
            }
            .search-bar {
                flex-direction: column;
                gap: 10px;
                border-radius: 16px;
                padding: 15px;
            }
            .search-btn {
                margin-left: 0;
            }
        }

        @media (max-width: 480px) {
            .hero-section h1 {
                font-size: 2.2rem;
            }
            .slot-card {
                flex-direction: column;
            }
            .slot-card-image {
                width: 100%;
                height: 150px;
            }
            .navbar-content {
                flex-direction: column;
                gap: 10px;
            }
        }

    </style>
</head>
<body data-view="auth">
